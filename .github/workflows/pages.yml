name: GitHub Pages

on:
  push:
    branches:
      - main
      - claude/new-session-zes7yl
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages ayari kapaliysa aç ve site adresini al
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Statik oyun; derleme adimi yok, depo kökü oldugu gibi yayinlanir
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
